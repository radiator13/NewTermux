name: Build Coexist APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=true
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.jvmargs=-Xmx13G -XX:+UseParallelGC -XX:ParallelGCThreads=4
  TERMUX_PACKAGE_VARIANT: apt-android-7

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install latest NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" 2>&1 | tail -5
          echo "NDK installed:"
          ls -d $ANDROID_HOME/ndk/*/

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            terminal-emulator/src/main/rust/target
          key: rust-android-aarch64-${{ hashFiles('terminal-emulator/src/main/rust/Cargo.lock', 'terminal-emulator/src/main/rust/Cargo.toml') }}-v1
          restore-keys: |
            rust-android-aarch64-

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-v1
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-${{ runner.os }}-

      - name: Cache bootstrap zips
        uses: actions/cache@v5
        with:
          path: app/src/main/cpp/bootstrap-*.zip
          key: bootstrap-${{ env.TERMUX_PACKAGE_VARIANT }}-2026.02.12-r1-v1
          restore-keys: |
            bootstrap-${{ env.TERMUX_PACKAGE_VARIANT }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate build timestamp
        id: timestamp
        run: echo "ts=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build Rust for Android arm64-v8a
        run: |
          ./terminal-emulator/build-rust.sh "$ANDROID_HOME/ndk/29.0.14206865"

      - name: Build coexist APK (arm64-v8a only)
        run: |
          ./gradlew assembleDemo \
            --parallel \
            --build-cache \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -PsplitAPKsForDebugBuilds=1 \
            -x lint

      - name: List APK output
        run: |
          echo "=== APK files ==="
          find app/build/outputs -name '*.apk' -type f -exec ls -lh {} \;
          echo ""
          echo "=== Native .so in APK ==="
          APK=$(find app/build/outputs -name '*.apk' | head -1)
          unzip -l "$APK" | grep -i "\.so" || echo "No .so files"
          echo ""
          echo "=== libtermux_rs.so details ==="
          unzip -p "$APK" "lib/arm64-v8a/libtermux_rs.so" 2>/dev/null | wc -c | awk '{printf "Size in APK: %.1f KB\n", $1/1024}'

      - name: Rename APKs with timestamp
        run: |
          find app/build/outputs -name '*.apk' -type f | while read f; do
            dir=$(dirname "$f")
            base=$(basename "$f" .apk)
            mv "$f" "${dir}/${base}_${{ steps.timestamp.outputs.ts }}.apk"
          done
          find app/build/outputs -name '*.apk' -type f -exec ls -lh {} \;

      - name: Upload coexist APK
        uses: actions/upload-artifact@v7
        with:
          name: newtermux-coexist-arm64-${{ steps.timestamp.outputs.ts }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
